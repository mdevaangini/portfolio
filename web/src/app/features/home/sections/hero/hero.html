<!--
  ABOUT THIS FILE: hero.html
  Hero (first screen): the markup (what you see).
-->
<section class="container hero" id="top" aria-labelledby="hero-title">
  <!-- Two soft, blurred apricot shapes drifting slowly behind the content (decoration only) -->
  <span class="blob blob--one" aria-hidden="true"></span>
  <span class="blob blob--two" aria-hidden="true"></span>

  <div class="hero__content">
    <p class="hero__hello rise" style="--delay: 0.05s">Hi, my name is</p>

    <h1 class="hero__title rise" id="hero-title" style="--delay: 0.15s">
      Devaangini Mehta.<br />
      <span class="hero__sub"><span class="typed">I build Angular apps</span><span class="cursor" aria-hidden="true">_</span></span>
    </h1>

    <p class="hero__intro rise" style="--delay: 0.25s">
      Frontend Engineer with 4.5+ years building Angular applications for fintech platforms serving
      150M+ users and 3B+ transactions a year.
    </p>

    <div class="hero__actions rise" style="--delay: 0.35s">
      <a class="btn btn--primary download" [href]="cv.path" [attr.download]="cv.downloadName">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v12M6 11l6 6 6-6M5 20h14" />
        </svg>
        Download CV
      </a>
      <a class="btn btn--outline arrow" href="#work">See my work <span aria-hidden="true">→</span></a>
    </div>
  </div>

  <div class="hero__media rise" style="--delay: 0.3s">
    <div class="photo">
      <span class="photo__ring" aria-hidden="true"></span>
      <!-- The photo lives in /public. To change it, replace headshot.jpg (square, about 600×600). -->
      <img class="photo__img" src="headshot.jpg" alt="Devaangini Mehta" width="300" height="300" />
    </div>
  </div>
</section>
