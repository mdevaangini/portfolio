<!--
  ABOUT THIS FILE: login-page.html
  The admin login form. Errors from the API (wrong password, locked) appear
  in the red box; field problems appear under each field.
-->
<main class="login" id="main">
  <section class="card" aria-labelledby="login-title">
    <p class="mono-label">// admin</p>
    <h1 id="login-title">Log in</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field__label">Email</span>
        <input type="email" formControlName="email" autocomplete="username"
               [attr.aria-invalid]="errorFor('email') ? 'true' : null" aria-describedby="email-error" />
        <span class="field__error" id="email-error">{{ errorFor('email') }}</span>
      </label>

      <label class="field">
        <span class="field__label">Password</span>
        <input type="password" formControlName="password" autocomplete="current-password"
               [attr.aria-invalid]="errorFor('password') ? 'true' : null" aria-describedby="password-error" />
        <span class="field__error" id="password-error">{{ errorFor('password') }}</span>
      </label>

      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }

      <button class="btn btn--navy" type="submit" [disabled]="sending()">
        {{ sending() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <a class="back" routerLink="/">← Back to the site</a>
  </section>
</main>
