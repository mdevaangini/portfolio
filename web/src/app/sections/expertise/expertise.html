<!--
  ABOUT THIS FILE: expertise.html
  Expertise section (01 · What I do): the markup (what you see).
-->
<section class="container expertise" id="expertise" aria-labelledby="expertise-title">
  <app-section-heading class="reveal" index="01" title="What I do" headingId="expertise-title" />

  <ul class="cards stagger">
    @for (area of areas; track area.tag) {
      <li class="card lift reveal">
        <span class="mono-label">// {{ area.tag }}</span>
        <h3 class="card__title">{{ area.title }}</h3>
        <p class="card__text">{{ area.description }}</p>
      </li>
    }
  </ul>
</section>
